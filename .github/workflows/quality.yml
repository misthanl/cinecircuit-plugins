name: Plugin quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Backend SDK, package validation and actual-host integration are enforced by the
# private host's independent-plugin-contracts job against its pinned plugin commit.
# Public plugin CI requires only this repository and the public frontend SDK.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality:frontend
      - run: pnpm audit --audit-level=high
