[mypy]
python_version = 3.12
files = cinecircuit_plugins
exclude = (^|[/\\])(_vendor|test_[^/\\]*)
follow_imports = normal
ignore_missing_imports = False
warn_unused_ignores = True
check_untyped_defs = True
warn_redundant_casts = True
strict_equality = True
no_implicit_optional = True

# Vendored OpenCC is upstream code, not a first-party typing boundary.
[mypy-cinecircuit_plugins.subtitle_manager._vendor.*]
follow_imports = skip

# Supplied by the host at runtime, constrained by plugin_dependency_guard.py.
[mypy-app.modules.plugins.contracts,app.modules.plugins.permissions,app.modules.plugins.runtime_services]
ignore_missing_imports = True

# Build/test registry discovery is not part of any installable plugin package.
[mypy-app.modules.plugins.registry]
ignore_missing_imports = True
